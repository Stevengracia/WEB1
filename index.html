<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steven | Centurialmc</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00a2ff;
            --accent: #5865F2;
            --bg: #0a0b10;
            --card-bg: rgba(255, 255, 255, 0.05);
            --online: #43b581;
            --idle: #faa61a;
            --dnd: #f04747;
            --offline: #747f8d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at top right, #1a1b2e, #0a0b10);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Contenedor Principal */
        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 450px;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* Efecto de Brillo de Fondo */
        .profile-card::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--primary), var(--accent), transparent);
            border-radius: 24px;
            z-index: -1;
            opacity: 0.3;
        }

        /* Logo Centurialmc */
        .server-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--primary);
            box-shadow: 0 0 20px rgba(0, 162, 255, 0.5);
            margin-bottom: 20px;
            object-fit: cover;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .role {
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 25px;
            display: block;
        }

        /* Estado en Tiempo Real */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: var(--offline);
            box-shadow: 0 0 10px var(--offline);
        }

        /* Botón de Discord */
        .btn-discord {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(88, 101, 242, 0.2);
        }

        .btn-discord:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(88, 101, 242, 0.4);
            filter: brightness(1.1);
        }

        /* Spotify (Solo aparece si escuchas algo) */
        #spotify-container {
            margin-top: 25px;
            padding: 15px;
            background: rgba(30, 215, 96, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(30, 215, 96, 0.2);
            display: none; /* Se activa por JS */
            text-align: left;
        }

        .spotify-info { display: flex; align-items: center; gap: 12px; }
        .spotify-info img { width: 45px; border-radius: 8px; }
        .song-name { font-size: 0.85rem; font-weight: 700; display: block; color: #1DB954; }
        .artist-name { font-size: 0.75rem; color: #aaa; }

    </style>
</head>
<body>

    <div class="profile-card">
        <img src="https://i.imgur.com/8YvLqXp.png" alt="Centurialmc Logo" class="server-logo">
        
        <h1>STEVEN</h1>
        <span class="role">OWNER @ CENTURIALMC</span>

        <div class="status-badge">
            <div class="dot" id="status-dot"></div>
            <span id="status-text">Cargando...</span>
        </div>

        <a href="https://discord.gg/5KJbFF9t" class="btn-discord" target="_blank">
            <svg width="20" viewBox="0 0 127.14 96.36" fill="white"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.71,32.65-1.82,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14h0C130.46,50.45,121.31,26.69,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5.12-12.67,11.41-12.67S54,46,53.86,53,48.74,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.12-12.67,11.44-12.67S96.22,46,96.08,53,91,65.69,84.69,65.69Z"/></svg>
            UNIRSE AL DISCORD
        </a>

        <div id="spotify-container">
            <p style="font-size: 0.6rem; text-transform: uppercase; margin-bottom: 8px; color: #1DB954; font-weight: bold;">Escuchando ahora</p>
            <div class="spotify-info">
                <img id="spotify-art" src="" alt="Album">
                <div>
                    <span class="song-name" id="spotify-song">Canción</span>
                    <span class="artist-name" id="spotify-artist">Artista</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ID = "1367889395067260960";
        const dot = document.getElementById('status-dot');
        const text = document.getElementById('status-text');

        async function updateStatus() {
            try {
                const res = await fetch(`https://api.lanyard.rest/v1/users/${ID}`);
                const { data } = await res.json();

                // Actualizar Color de Estado
                const colors = { online: '#43b581', idle: '#faa61a', dnd: '#f04747', offline: '#747f8d' };
                const names = { online: 'Online & Activo', idle: 'Ausente', dnd: 'No molestar', offline: 'Desconectado' };
                
                const currentStatus = data.discord_status;
                dot.style.background = colors[currentStatus];
                dot.style.boxShadow = `0 0 10px ${colors[currentStatus]}`;
                text.innerText = names[currentStatus];

                // Spotify
                const spotifyBox = document.getElementById('spotify-container');
                if (data.listening_to_spotify) {
                    spotifyBox.style.display = 'block';
                    document.getElementById('spotify-song').innerText = data.spotify.song;
                    document.getElementById('spotify-artist').innerText = data.spotify.artist;
                    document.getElementById('spotify-art').src = data.spotify.album_art_url;
                } else {
                    spotifyBox.style.display = 'none';
                }

            } catch (e) { console.error("Error cargando status"); }
        }

        setInterval(updateStatus, 10000);
        updateStatus();
    </script>
</body>
</html>
